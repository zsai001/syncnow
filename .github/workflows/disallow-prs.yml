name: Disallow Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: [
                'Thank you for your interest in **SyncNow Relay**!',
                '',
                'This repository is currently maintained as a read-only open-source release mirror and **does not accept Pull Requests**.',
                'Feel free to fork this repository for your own self-hosted customization.',
                '',
                '---',
                '',
                '感谢关注 **SyncNow 自建中继**！本仓库当前**不接受外部 Pull Request**，如需定制请直接 Fork 后自行部署。',
              ].join('\n'),
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number,
              state: 'closed',
            });

            await github.rest.issues.lock({
              owner,
              repo,
              issue_number: pull_number,
              lock_reason: 'off-topic',
            });
