name: CI & Multi-Arch Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go unit tests
        run: go test -race -v ./...
      - name: Cross-compile static Linux & macOS binaries
        run: make build-all

  test-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloudflare devDependencies
        run: npm install
      - name: Typecheck & Wrangler bundle dry-run
        run: |
          npm run typecheck
          npm run deploy:dry-run

  docker-publish:
    needs: [test-go, test-cloudflare]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push multi-arch Docker image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syncnow-relay:latest
            ghcr.io/${{ github.repository_owner }}/syncnow-relay:${{ github.ref_name }}
